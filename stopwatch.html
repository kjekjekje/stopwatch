<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스탑워치</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1d1f23;
    --muted: #8a8f98;
    --line: #e6e8eb;
    --start: #1f9d55;
    --stop: #d64545;
    --neutral: #5b6270;
    --best: #1f9d55;
    --worst: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417;
      --card: #1c1f24;
      --text: #eef0f3;
      --muted: #8a8f98;
      --line: #2b2f36;
      --neutral: #6b7280;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px 24px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.05em;
  }
  .display {
    font-variant-numeric: tabular-nums;
    font-size: clamp(44px, 14vw, 64px);
    font-weight: 300;
    text-align: center;
    margin: 12px 0 28px;
    letter-spacing: -0.02em;
  }
  .display .ms { font-size: 0.6em; color: var(--muted); }
  .buttons {
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }
  button {
    flex: 1;
    height: 64px;
    border: none;
    border-radius: 32px;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: transform 0.08s, opacity 0.2s;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; cursor: default; }
  #startBtn { background: var(--start); }
  #startBtn.running { background: var(--stop); }
  #lapBtn { background: var(--neutral); }
  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 14px;
  }
  ul {
    list-style: none;
    margin: 20px 0 0;
    padding: 0;
    max-height: 260px;
    overflow-y: auto;
  }
  li {
    display: flex;
    justify-content: space-between;
    padding: 12px 4px;
    border-top: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  li.best { color: var(--best); }
  li.worst { color: var(--worst); }
</style>
</head>
<body>
  <div class="card">
    <h1>STOPWATCH</h1>
    <div class="display" id="display">00:00<span class="ms">.00</span></div>
    <div class="buttons">
      <button id="lapBtn" disabled>랩</button>
      <button id="startBtn">시작</button>
    </div>
    <div class="hint">Space: 시작/정지 · L: 랩 · R: 초기화</div>
    <ul id="laps"></ul>
  </div>

<script>
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapList = document.getElementById('laps');

  let running = false;
  let startTime = 0;   // performance.now() 기준 시작 시각
  let elapsed = 0;     // 정지 시점까지 누적 시간(ms)
  let lastLapTotal = 0;
  let laps = [];       // 각 랩 구간 시간(ms)
  let rafId = null;

  function format(ms) {
    const totalCs = Math.floor(ms / 10);
    const cs = totalCs % 100;
    const totalSec = Math.floor(totalCs / 100);
    const s = totalSec % 60;
    const totalMin = Math.floor(totalSec / 60);
    const m = totalMin % 60;
    const h = Math.floor(totalMin / 60);
    const pad = n => String(n).padStart(2, '0');
    const main = (h > 0 ? h + ':' + pad(m) : pad(m)) + ':' + pad(s);
    return { main, ms: '.' + pad(cs) };
  }

  function current() {
    return running ? elapsed + (performance.now() - startTime) : elapsed;
  }

  function render() {
    const t = format(current());
    display.innerHTML = t.main + '<span class="ms">' + t.ms + '</span>';
  }

  function tick() {
    render();
    rafId = requestAnimationFrame(tick);
  }

  function toggle() {
    if (running) {
      elapsed += performance.now() - startTime;
      running = false;
      cancelAnimationFrame(rafId);
      render();
    } else {
      startTime = performance.now();
      running = true;
      tick();
    }
    updateButtons();
  }

  function lapOrReset() {
    if (running) lap(); else reset();
  }

  function lap() {
    if (!running) return;
    const total = current();
    laps.unshift(total - lastLapTotal);
    lastLapTotal = total;
    renderLaps();
  }

  function reset() {
    if (running) return;
    elapsed = 0;
    lastLapTotal = 0;
    laps = [];
    render();
    renderLaps();
    updateButtons();
  }

  function renderLaps() {
    lapList.innerHTML = '';
    const min = Math.min(...laps), max = Math.max(...laps);
    laps.forEach((t, i) => {
      const li = document.createElement('li');
      if (laps.length > 1 && t === min) li.className = 'best';
      if (laps.length > 1 && t === max) li.className = 'worst';
      const f = format(t);
      li.innerHTML = '<span>랩 ' + (laps.length - i) + '</span><span>' + f.main + f.ms + '</span>';
      lapList.appendChild(li);
    });
  }

  function updateButtons() {
    startBtn.textContent = running ? '정지' : '시작';
    startBtn.classList.toggle('running', running);
    lapBtn.textContent = running ? '랩' : '초기화';
    lapBtn.disabled = !running && elapsed === 0;
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', lapOrReset);

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') lap();
    else if (e.key === 'r' || e.key === 'R') reset();
  });

  updateButtons();
</script>
</body>
</html>
